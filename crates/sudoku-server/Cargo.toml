[package]
name = "sudoku-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.9"
futures-util = "0.3"

sudoku-engine = { path = "../sudoku-engine" }